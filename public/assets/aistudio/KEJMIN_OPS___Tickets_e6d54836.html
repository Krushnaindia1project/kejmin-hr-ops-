<div class="app">

<script>
const ST=[["created","Task created"],["review","Task on review"],["resp","Response received"],["closed","Task closed"],["reopen","Task reopened"]];

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function readAtts(files,cat){const out=[];for(const f of files){if(!(f.type.startsWith("image/")||f.type=="application/pdf")){toast(f.name+": only images and PDFs are allowed");continue}out.push({id:Math.random().toString(36).slice(2),name:f.name,type:f.type,size:f.size,cat,by:ME,at:now(),data:await rd(f)})}return out}
const attH=(a,rm)=>`<div class="at">${a.type.startsWith("image/")?`<img class="th" src="${a.data}" alt="" data-a="${a.id}">`:`<div class="th" data-a="${a.id}">PDF</div>`}<div class="nm"><b>${esc(a.name)}</b><small>${fmt(a.size)} · ${esc(a.by)} · ${a.at}</small></div><button class="btn" data-a="${a.id}">View</button><button class="btn" data-d="${a.id}">Download</button>${rm?`<button class="btn d" data-r="${a.id}">Remove</button>`:""}</div>`;

function viewAtt(a){let src=a.data;if(a.type=="application/pdf"){const bin=atob(a.data.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);src=URL.createObjectURL(new Blob([u],{type:a.type}))}
$("#vwP").innerHTML=`<div class="meta"><b>${esc(a.name)}</b><span class="sp"></span><button class="btn s" id="vwd">Download</button><button class="btn s" id="vwx">Close</button></div><div style="margin-top:12px">${a.type.startsWith("image/")?`<img src="${src}" alt="${esc(a.name)}">`:`<iframe src="${src}" title="${esc(a.name)}"></iframe>`}</div>`;
$("#ovView").classList.add("show");$("#vwd").onclick=()=>dlAtt(a);$("#vwx").onclick=()=>$("#ovView").classList.remove("show")}
async function saveBlob(blob,name){let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
if(d){try{await d.save({filename:name,data:blob});toast("Downloaded "+name)}catch(e){toast(e&&e.code=="declined"?"Download cancelled":"Download isn’t available here")}return}
const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),4000)}
async function xlsxExport(L){if(!window.XLSX){toast("The Excel library did not load. Check your connection and try again.");return}
const X=XLSX,wb=X.utils.book_new();
const sum=[["KEJMIN OPS – Ticket report"],["Generated",now()],["Total tickets",L.length],[],["Status","Tickets"],...ST.map(s=>[s[1],L.filter(t=>t.status==s[0]).length]),[],["Priority","Tickets"],...PR.map(p=>[p,L.filter(t=>t.pri==p).length]),[],["Assignee","Tickets"],...["",...USERS].map(u=>[u||"Unassigned",L.filter(t=>t.assignee==u).length]),[],["Type","Tickets"],...[...Object.keys(TY),...(S.customTypes||[])].map(k=>[tyInfo(k)[0],L.filter(t=>t.type==k).length])];
const tk=[["Ticket","Summary","Type","Priority","Status","Assignee","Reporter","Incident date & time","Labels","Description","Subtasks done","Subtasks total","Comments","Attachments"],...L.map(t=>[key(t),t.title,tyInfo(t.type)[0],t.pri,stN(t.status),t.assignee||"Unassigned",t.reporter,t.incident?fmtDT(t.incident):"",t.labels.join(", "),t.desc,t.subs.filter(s=>s.d).length,t.subs.length,t.comments.length,(t.atts||[]).length])];
const cm=[["Ticket","Author","Date","Comment"]];L.forEach(t=>t.comments.forEach(c=>cm.push([key(t),c.u,c.at,c.t])));
const lg=[["Ticket","Date","Activity"]];L.forEach(t=>t.log.forEach(l=>lg.push([key(t),l.at,l.t])));
const at=[["Ticket","Category","File name","File type","Size (KB)","Uploaded by","Uploaded at"]];L.forEach(t=>(t.atts||[]).forEach(a=>at.push([key(t),a.cat,a.name,a.type,Math.round(a.size/1024),a.by,a.at])));
[["Summary",sum,[28,16]],["Tickets",tk,[10,40,16,10,20,20,20,24,22,50,13,13,10,12]],["Comments",cm,[10,20,22,60]],["Activity",lg,[10,22,70]],["Attachments",at,[10,14,36,18,10,20,22]]].forEach(([n,d,w])=>{const ws=X.utils.aoa_to_sheet(d);ws["!cols"]=w.map(x=>({wch:x}));X.utils.book_append_sheet(wb,ws,n)});

async function dlAtt(a){const bin=atob(a.data.split(",")[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const blob=new Blob([u],{type:a.type});
let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
if(d){try{await d.save({filename:a.name,data:blob});toast("Downloaded "+a.name)}catch(e){toast(e&&e.code=="declined"?"Download cancelled":e&&e.code=="rejected_extension"?"This file type can’t be downloaded here":"Download isn’t available here")}return}
const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download=a.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),4000)}
function attBind(t,id){let cat;const f=$("#upf");document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{cat=b.dataset.up;f.click()});
f.onchange=async()=>{const n=await readAtts(f.files,cat);if(n.length){t.atts=(t.atts||[]).concat(n);t.log.unshift({t:`${n.length} file(s) added to ${cat}: ${n.map(x=>x.name).join(", ")}`,at:now()});save();main();detail(id);toast("File added to "+cat)}};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x==b));draw()});
$("#new").onclick=newT;
if(!IS_DEV)$("#clr").remove();else $("#clr").onclick=()=>ask("This permanently deletes all tickets, comments, attachments and activity history. This cannot be undone.",async()=>{S={seq:1,tickets:[]};try{if(IDB.db)await IDB.set("tickets",S)}catch(e){}try{localStorage.removeItem("kej_tickets")}catch(e){}$("#ovDet").classList.remove("show");main();toast("All tickets and records deleted")},"DELETE");
["ovNew","ovDet","ovView"].forEach(i=>$("#"+i).onclick=e=>{if(e.target.id==i)e.target.classList.remove("show")});
document.onkeydown=e=>{if(e.key=="Escape")document.querySelectorAll(".ov").forEach(o=>o.classList.remove("show"))};
load().then(main);
</script></body></html>
